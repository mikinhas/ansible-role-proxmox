---
- name: Enable IPv4 forwarding for NAT
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-proxmox-nat.conf
    sysctl_set: true
    state: present
    reload: true
  when: proxmox_nat_enable

- name: Stage the internal bridges via the Proxmox API
  delegate_to: localhost
  community.proxmox.proxmox_node_network:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password or omit }}"
    api_token_id: "{{ proxmox_api_token_id or omit }}"
    api_token_secret: "{{ proxmox_api_token_secret or omit }}"
    validate_certs: "{{ proxmox_api_validate_certs }}"
    node: "{{ proxmox_node }}"
    iface: "{{ item.iface }}"
    iface_type: bridge
    cidr: "{{ item.cidr }}"
    bridge_ports: "{{ item.bridge_ports | default('') }}"
    autostart: "{{ item.autostart | default(true) }}"
    comments: "{{ item.comments | default('Internal bridge for VMs - managed by the mikinhas.proxmox role') }}"
    state: present
  loop: "{{ proxmox_internal_bridges }}"
  loop_control:
    label: "{{ item.iface }}"
  notify: Apply Proxmox network configuration

- name: Install the NAT service
  ansible.builtin.template:
    src: proxmox-nat.service.j2
    dest: /etc/systemd/system/proxmox-nat.service
    owner: root
    group: root
    mode: "0644"
  when: proxmox_nat_enable
  notify: Restart the Proxmox NAT service

- name: Enable the NAT service
  ansible.builtin.systemd:
    name: proxmox-nat
    state: started
    enabled: true
    daemon_reload: true
  when: proxmox_nat_enable

- name: Remove the NAT service
  when: not proxmox_nat_enable
  block:
    - name: Stop and disable the NAT service
      ansible.builtin.systemd:
        name: proxmox-nat
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the NAT unit file
      ansible.builtin.file:
        path: /etc/systemd/system/proxmox-nat.service
        state: absent
      notify: Reload systemd
