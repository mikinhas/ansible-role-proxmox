---
- name: Build node firewall rules
  ansible.builtin.set_fact:
    proxmox_node_rules: >-
      {{ proxmox_node_rules | default([])
         + [item | combine({'pos': idx, 'type': item.type | default('in')})] }}
  loop: "{{ proxmox_firewall_host_rules }}"
  loop_control:
    index_var: idx
    label: "{{ item.comment | default(item.dport | default('rule')) }}"

- name: Build datacenter firewall rules
  ansible.builtin.set_fact:
    proxmox_cluster_rules: >-
      {{ proxmox_cluster_rules | default([])
         + [item | combine({'pos': idx, 'type': item.type | default('in')})] }}
  loop: "{{ proxmox_firewall_cluster_rules }}"
  loop_control:
    index_var: idx
    label: "{{ item.comment | default(item.dport | default('rule')) }}"

- name: Apply firewall configuration via the Proxmox API
  delegate_to: localhost
  when: proxmox_firewall_apply
  module_defaults:
    community.proxmox.proxmox_cluster_firewall: &pve_api
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password or omit }}"
      api_token_id: "{{ proxmox_api_token_id or omit }}"
      api_token_secret: "{{ proxmox_api_token_secret or omit }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
    community.proxmox.proxmox_firewall: *pve_api
  block:
    - name: Configure node firewall rules
      community.proxmox.proxmox_firewall:
        level: node
        node: "{{ proxmox_node }}"
        state: present
        rules: "{{ proxmox_node_rules | default([]) }}"
      when: proxmox_firewall_host_rules | length > 0

    - name: Configure datacenter firewall rules
      community.proxmox.proxmox_firewall:
        level: cluster
        state: present
        rules: "{{ proxmox_cluster_rules | default([]) }}"
      when: proxmox_firewall_cluster_rules | length > 0

    - name: Configure datacenter firewall options
      community.proxmox.proxmox_cluster_firewall:
        state: "{{ 'enabled' if proxmox_firewall_enable else 'disabled' }}"
        input_policy: "{{ proxmox_firewall_policy_in }}"
        output_policy: "{{ proxmox_firewall_policy_out }}"
        forward_policy: "{{ proxmox_firewall_policy_forward }}"
        ebtables: "{{ proxmox_firewall_ebtables }}"
