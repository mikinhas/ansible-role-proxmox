---
# Master toggle for this role (set false to skip, e.g. in CI without Proxmox)
proxmox_firewall_manage: true

# Apply the configuration against the Proxmox API. Set false to build the rule
# structures without talking to any API (e.g. in CI without a Proxmox host).
proxmox_firewall_apply: true

# Proxmox API connection (the proxmox_firewall module runs on the controller via
# delegate_to: localhost and talks to the node's API over HTTPS).
proxmox_api_host: "{{ ansible_host | default(inventory_hostname) }}"
proxmox_api_user: "root@pam"
proxmox_api_password: ""
proxmox_api_token_id: ""
proxmox_api_token_secret: ""
proxmox_api_validate_certs: false

# Proxmox node name (for /nodes/<node>/firewall). Defaults to the short hostname.
proxmox_node: "{{ ansible_hostname }}"

# Master switch (datacenter level) + default policies.
# policy_in/policy_out accept ACCEPT/REJECT/DROP; policy_forward only ACCEPT/DROP.
proxmox_firewall_enable: true
proxmox_firewall_policy_in: "ACCEPT"
proxmox_firewall_policy_out: "ACCEPT"
proxmox_firewall_policy_forward: "ACCEPT"
proxmox_firewall_ebtables: true

# Node firewall rules. Keep SSH (22) and the web UI (8006) to avoid lockout.
# Each rule: action (required) + optional type (default 'in'), proto, dport,
# source, dest, comment, enable. Positions are assigned automatically.
# dport is a string (the API accepts ports and ranges, e.g. "8000:8100").
proxmox_firewall_host_rules:
  - action: ACCEPT
    proto: tcp
    dport: "22"
    comment: SSH
  - action: ACCEPT
    proto: tcp
    dport: "8006"
    comment: Proxmox web UI

# Datacenter (cluster) firewall rules (same shape as host rules)
proxmox_firewall_cluster_rules: []
