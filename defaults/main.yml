---
proxmox_firewall_manage: true

proxmox_firewall_apply: true

proxmox_api_host: "{{ ansible_host | default(inventory_hostname) }}"
proxmox_api_user: "root@pam"
proxmox_api_password: ""
proxmox_api_token_id: ""
proxmox_api_token_secret: ""
proxmox_api_validate_certs: false

proxmox_node: "{{ ansible_hostname }}"

proxmox_firewall_enable: true
proxmox_firewall_policy_in: "ACCEPT"
proxmox_firewall_policy_out: "ACCEPT"
proxmox_firewall_policy_forward: "ACCEPT"
proxmox_firewall_ebtables: true

proxmox_firewall_host_rules:
  - action: ACCEPT
    proto: tcp
    dport: "22"
    comment: SSH
  - action: ACCEPT
    proto: tcp
    dport: "8006"
    comment: Proxmox web UI

proxmox_firewall_cluster_rules: []
proxmox_network_manage: false
proxmox_network_apply: true

proxmox_internal_bridges:
  - iface: vmbr1
    cidr: "10.0.0.1/24"

proxmox_nat_enable: true
proxmox_internal_subnet: "10.0.0.0/24"
proxmox_public_interface: vmbr0

proxmox_nat_port_forwards: []
#  - { proto: tcp, port: 443, to: "10.0.0.254", comment: "HTTPS" }

proxmox_template_manage: false

proxmox_template_image_dir: /var/lib/vz/template/qcow

proxmox_template_download_timeout: 300

proxmox_templates:
  - vmid: 9000
    name: debian-12-cloud
    image_url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
    storage: local-lvm
    bridge: vmbr0
    cores: 2
    memory: 2048
    disk_size: 10   # grow the imported disk to this size in GiB (optional)

proxmox_vm_manage: false

proxmox_vms: []
